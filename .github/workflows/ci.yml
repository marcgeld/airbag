name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    env:
      TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27.2"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift --version

      - name: Test CLI
        run: /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift test

      - name: Test sandbox restrictions
        run: ./Tests/Security/test.sh

      - name: Build release
        run: /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift build -c release --arch arm64
