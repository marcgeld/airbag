version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift-packages:
        patterns: ["*"]
        update-types: [minor, patch]
